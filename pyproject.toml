[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-paint"
dynamic = ["version"]
description = "Let your LLM paint: it writes, renders and checks images in code, without calling an image model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wexop" }]
keywords = ["image", "procedural", "generative-art", "sdf", "raymarching", "llm", "ai-agent", "claude", "skill"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.8",
    "scipy>=1.11",
    "skia-python>=87.5",
]

[project.urls]
Homepage = "https://github.com/Wexop/atelier"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
atelier = "atelier.cli:main"

[tool.setuptools]
packages = ["atelier"]

[tool.setuptools.dynamic]
version = { attr = "atelier.__version__" }   # bump it in atelier/__init__.py only

[tool.setuptools.package-data]
atelier = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
